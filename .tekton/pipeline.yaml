apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: verify-a100-inventory
spec:
  steps:
    - name: check-ibm-a100
      image: icr.io/continuous-delivery/pipeline/pipeline-base-image:2.96
      env:
        - name: IBMCLOUD_API_KEY
          valueFrom:
            secretKeyRef:
              name: secure-properties
              key: IBM_CLOUD_API_KEY
      script: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        echo "======================================"
        echo " IBM CLOUD A100 INVENTORY CHECK"
        echo "======================================"

        command -v curl >/dev/null
        command -v jq >/dev/null

        if [ -z "${IBMCLOUD_API_KEY:-}" ]; then
          echo "ERROR: IBM Cloud API key tidak ditemukan."
          exit 1
        fi

        echo "[1/3] Request IAM token..."

        TOKEN_JSON=$(curl -fsS \
          --retry 3 \
          --retry-delay 3 \
          -X POST \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -H "Accept: application/json" \
          --data-urlencode "grant_type=urn:ibm:params:oauth:grant-type:apikey" \
          --data-urlencode "apikey=${IBMCLOUD_API_KEY}" \
          "https://iam.cloud.ibm.com/identity/token")

        TOKEN=$(echo "$TOKEN_JSON" | jq -er '.access_token')
        echo "IAM authentication: OK"

        check_region() {
          REGION="$1"
          ENDPOINT="$2"
          shift 2

          echo
          echo "======================================"
          echo " REGION: ${REGION}"
          echo "======================================"

          DATA=$(curl -fsS \
            --retry 3 \
            --retry-delay 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/json" \
            "${ENDPOINT}/v1/instances?version=2026-11-01&generation=2")

          COUNT=0

          for NAME in "$@"; do
            INSTANCE=$(echo "$DATA" | jq -c --arg n "$NAME" \
              '.instances[] | select(.name == $n)' | head -n 1)

            if [ -z "$INSTANCE" ]; then
              echo "MISSING: ${NAME}"
              continue
            fi

            STATUS=$(echo "$INSTANCE" | jq -r '.status // "unknown"')
            PROFILE=$(echo "$INSTANCE" | jq -r '.profile.name // "unknown"')
            ZONE=$(echo "$INSTANCE" | jq -r '.zone.name // "unknown"')
            IP=$(echo "$INSTANCE" | jq -r '.primary_network_interface.primary_ip.address // "unknown"')

            printf "%-20s | %-10s | %-25s | %-10s | %s\n" \
              "$NAME" "$STATUS" "$PROFILE" "$ZONE" "$IP"

            COUNT=$((COUNT + 1))
          done

          echo "Found ${COUNT} of 4 expected instances."
        }

        echo "[2/3] Checking Frankfurt and US East..."

        check_region "eu-de" \
          "https://eu-de.iaas.cloud.ibm.com" \
          a100-eu-de-01 \
          a100-eu-de-02 \
          a100-eu-de-03 \
          a100-eu-de-04

        check_region "us-east" \
          "https://us-east.iaas.cloud.ibm.com" \
          a100-us-east-01 \
          a100-us-east-02 \
          a100-us-east-03 \
          a100-us-east-04

        echo
        echo "======================================"
        echo "[3/3] INVENTORY CHECK COMPLETED"
        echo "======================================"
        echo "Read-only inventory check completed."
        echo "No instance was created, stopped, or deleted."

---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: h200-worker-pipeline
spec:
  tasks:
    - name: verify-a100-inventory
      taskRef:
        name: verify-a100-inventory

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: h200-worker-binding
spec:
  params: []

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: h200-worker-template
spec:
  params: []
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: h200-worker-run-
      spec:
        pipelineRef:
          name: h200-worker-pipeline

---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: h200-worker-listener
spec:
  triggers:
    - name: h200-worker-trigger
      bindings:
        - ref: h200-worker-binding
      template:
        ref: h200-worker-template
